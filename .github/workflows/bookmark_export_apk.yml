name: Build bookmark export APK

on:
  push:
    branches: [ bookmark-export ]
  workflow_dispatch:

concurrency:
  group: bookmark-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Apply formatting
        run: |
          ./gradlew spotlessApply
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply formatting"
            git push origin HEAD:bookmark-export
          fi
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Test the bookmark module
        run: ./gradlew :features:bookmark:testDebugUnitTest
      - name: Build the free debug APK
        run: ./gradlew :app:assembleFreeDebug
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: voice-bookmark-export-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
