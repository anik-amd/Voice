name: Build bookmark export APK

on:
  push:
    branches: [ bookmark-export ]
  workflow_dispatch:

concurrency:
  group: bookmark-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Test the bookmark module
        run: ./gradlew :features:bookmark:testDebugUnitTest
      - name: Build the free debug APK
        run: ./gradlew :app:assembleFreeDebug
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: voice-bookmark-export-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
