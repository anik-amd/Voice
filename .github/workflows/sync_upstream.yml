name: Update from upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: personal-build
          fetch-depth: 0
      - id: merge
        name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/PaulWoitaschek/Voice.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "The patches already sit on the latest upstream."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:personal-build
          echo "updated=true" >> "$GITHUB_OUTPUT"

  build:
    needs: merge
    if: needs.merge.outputs.updated == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/personal_debug_apk.yml
