name: Build personal debug APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: personal-build
      - uses: ./.github/actions/build_setup
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$STORE_PASSWORD"
          } > signing/signing.properties
      - name: Apply formatting
        run: |
          ./gradlew spotlessApply
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply formatting"
            git push origin HEAD:personal-build
          fi
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Test the bookmark module
        run: ./gradlew :features:bookmark:testDebugUnitTest
      - name: Test the locales
        run: ./gradlew :app:testFreeDebugUnitTest --tests voice.app.LocaleConfigTest
      - name: Build the free debug APK
        run: ./gradlew :app:assembleFreeDebug
      - name: Print the signature
        run: |
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/free/debug/*.apk
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: voice-personal-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
